name: Daily public digest

on:
  schedule:
    # Daily at 06:30 UTC
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect feeds + publish digest
        run: python3 scripts/publish_digest.py

      - name: Commit public digest (not private collected.js)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep inbox private — never commit js/collected.js
          git add articles/digest-*.html js/i18n.js
          if git diff --cached --quiet; then
            echo "No digest changes"
            exit 0
          fi
          git commit -m "Publish daily SAIL digest ($(date -u +%Y-%m-%d))"
          git push
