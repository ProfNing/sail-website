name: Daily public digest

on:
  schedule:
    # Daily at 06:30 UTC
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect feeds + publish digest
        run: python3 scripts/publish_digest.py

      - name: Commit public digest (not private drafts / collected.js)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep inbox + 小红书 drafts private — never commit them
          git add articles/digest-*.html js/i18n.js
          if git diff --cached --quiet; then
            echo "No digest changes"
            exit 0
          fi
          git commit -m "Publish daily SAIL digest ($(date -u +%Y-%m-%d))"
          git push

      # Email 小红书 draft to your phone. Skips if XHS_EMAIL_TO secret is unset.
      # Outlook / Microsoft 365 secrets:
      #   XHS_EMAIL_TO  — address you open on your phone
      #   SMTP_HOST     — smtp.office365.com
      #   SMTP_PORT     — 587
      #   SMTP_USER     — full Outlook address
      #   SMTP_PASS     — password or Microsoft app password
      #   SMTP_FROM     — same as SMTP_USER (optional)
      - name: Email 小红书 draft
        env:
          XHS_EMAIL_TO: ${{ secrets.XHS_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python3 scripts/email_xhs_draft.py
