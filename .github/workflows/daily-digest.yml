name: Daily public digest

on:
  schedule:
    # Morning primary; evening only fills in if morning was skipped (see skip-if-exists)
    - cron: "30 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today’s digest even if it already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect feeds + publish digest
        id: publish
        env:
          # Optional: unlock high-quality 小红书 drafts (OpenAI-compatible)
          # XHS_LLM_API_KEY, XHS_LLM_BASE_URL (optional), XHS_LLM_MODEL (optional, default gpt-4o-mini)
          XHS_LLM_API_KEY: ${{ secrets.XHS_LLM_API_KEY }}
          XHS_LLM_BASE_URL: ${{ secrets.XHS_LLM_BASE_URL }}
          XHS_LLM_MODEL: ${{ secrets.XHS_LLM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          DAY="$(date -u +%Y-%m-%d)"
          FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}"
          if [ -f "articles/digest-${DAY}.html" ] && [ "$FORCE" != "true" ]; then
            echo "Digest for ${DAY} already exists — skip rewrite and email (one per day)."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FORCE" = "true" ]; then
            python3 scripts/publish_digest.py --force
          else
            python3 scripts/publish_digest.py
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Commit public digest (not private drafts / collected.js)
        if: steps.publish.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep inbox + 小红书 drafts private — never commit them
          # Listing pages get ?v= cache-busters so Home/Articles refetch i18n.js
          git add articles/digest-*.html js/i18n.js index.html about.html \
            articles/index.html topics/*.html learn/index.html
          if git diff --cached --quiet; then
            echo "No digest changes"
            exit 0
          fi
          git commit -m "Publish daily SAIL digest ($(date -u +%Y-%m-%d))"
          git push

      # Prefer Resend (Outlook blocks basic SMTP auth for many accounts).
      # Secrets:
      #   XHS_EMAIL_TO     — Outlook (or any) inbox on your phone
      #   RESEND_API_KEY   — https://resend.com
      #   EMAIL_FROM       — verified sender in Resend, e.g. onboarding@resend.dev while testing
      # Optional SMTP fallback (Gmail app password, etc.):
      #   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM
      - name: Email 小红书 draft
        if: steps.publish.outputs.published == 'true'
        continue-on-error: true
        env:
          XHS_EMAIL_TO: ${{ secrets.XHS_EMAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python3 scripts/email_xhs_draft.py
