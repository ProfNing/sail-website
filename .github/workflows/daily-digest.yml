name: Daily public digest

on:
  schedule:
    # Daily at 06:30 UTC
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect feeds + publish digest
        run: python3 scripts/publish_digest.py

      - name: Commit public digest (not private drafts / collected.js)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep inbox + 小红书 drafts private — never commit them
          git add articles/digest-*.html js/i18n.js
          if git diff --cached --quiet; then
            echo "No digest changes"
            exit 0
          fi
          git commit -m "Publish daily SAIL digest ($(date -u +%Y-%m-%d))"
          git push

      # Prefer Resend (Outlook blocks basic SMTP auth for many accounts).
      # Secrets:
      #   XHS_EMAIL_TO     — Outlook (or any) inbox on your phone
      #   RESEND_API_KEY   — https://resend.com
      #   EMAIL_FROM       — verified sender in Resend, e.g. onboarding@resend.dev while testing
      # Optional SMTP fallback (Gmail app password, etc.):
      #   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM
      - name: Email 小红书 draft
        continue-on-error: true
        env:
          XHS_EMAIL_TO: ${{ secrets.XHS_EMAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python3 scripts/email_xhs_draft.py
